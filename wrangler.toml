name = "spider-deploy-bot"
main = "worker.js"
compatibility_date = "2026-08-01"

# پس از اجرای دستور زیر، id واقعی رو اینجا جایگزین کن:
#   wrangler kv namespace create BOT_KV
[[kv_namespaces]]
binding = "BOT_KV"
id = "REPLACE_WITH_KV_ID"

# متغیرهای متنی (غیرمحرمانه). این‌ها باید به مسیر همین ریپو/فایل اشاره کنن
# تا قابلیت «Clone Bot» بتونه سورس رو از GitHub بخونه.
[vars]
SOURCE_REPO = "mamad3743/spider-deploy-bot"
SOURCE_BRANCH = "main"
SOURCE_FILE = "worker.js"

# این‌ها secret هستن، با wrangler ست کن (پایین README رو ببین):
#   BOT_TOKEN
#   ADMIN_CHAT_ID
#   WEBHOOK_SECRET
