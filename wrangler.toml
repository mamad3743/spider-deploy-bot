name = "spider-deploy-bot"
main = "worker.js"
compatibility_date = "2026-08-01"

# پس از اجرای دستور زیر، id واقعی رو اینجا جایگزین کن:
#   wrangler kv namespace create BOT_KV
[[kv_namespaces]]
binding = "BOT_KV"
id = "REPLACE_WITH_KV_ID"

# اجرای دوره‌ای برای Auto-Update پنل‌ها — هر روز ساعت ۰۳:۰۰ UTC
[triggers]
crons = ["0 3 * * *"]

# متغیرهای متنی (غیرمحرمانه). SOURCE_REPO باید به همون ریپو/برنچی اشاره کنه
# که bot-core.js و worker.js توش هستن (برای قابلیت Clone Bot).
[vars]
SOURCE_REPO = "YOUR_GITHUB_USERNAME/spider-deploy-bot"
SOURCE_BRANCH = "main"
# REQUIRED_CHANNELS = "@yourchannel,@yourgroup"   # اختیاری — عضویت اجباری

# این‌ها secret هستن، با wrangler ست کن (پایین README رو ببین):
#   BOT_TOKEN
#   ADMIN_CHAT_ID
#   WEBHOOK_SECRET
